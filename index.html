<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah 3D - Multiplayer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    background: #0a0e17;
  }
  #gameCanvas { display: block; }

  #ui-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* ---- Lobby Screen ---- */
  #lobby {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    z-index: 100;
  }
  .lobby-card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px;
    width: 380px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lobby-card h1 {
    color: #f1f5f9;
    font-size: 26px;
    margin-bottom: 8px;
    text-align: center;
  }
  .lobby-card p.subtitle {
    color: #94a3b8;
    text-align: center;
    margin-bottom: 28px;
    font-size: 14px;
  }
  .lobby-card input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 15px;
    outline: none;
  }
  .lobby-card input:focus { border-color: #38bdf8; }
  .lobby-card button {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.1s, opacity 0.2s;
  }
  .lobby-card button:active { transform: scale(0.98); }
  .btn-primary { background: #38bdf8; color: #0f172a; }
  .btn-secondary { background: #334155; color: #f1f5f9; }
  .divider {
    display: flex;
    align-items: center;
    color: #64748b;
    font-size: 12px;
    margin: 18px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #334155;
  }
  .divider span { padding: 0 10px; }
  #lobby-status {
    text-align: center;
    color: #fbbf24;
    font-size: 13px;
    min-height: 18px;
    margin-top: 6px;
  }
  #room-code-display {
    text-align: center;
    color: #4ade80;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    margin: 10px 0;
    display: none;
  }

  /* ---- HUD ---- */
  #hud {
    position: fixed;
    top: 16px; left: 16px;
    color: #f1f5f9;
    font-size: 14px;
    background: rgba(15, 23, 42, 0.75);
    padding: 12px 16px;
    border-radius: 10px;
    display: none;
    z-index: 20;
  }
  #hud .score-row { display: flex; gap: 16px; margin-bottom: 4px; }
  #hud .you { color: #38bdf8; font-weight: bold; }
  #hud .friend { color: #fb7185; font-weight: bold; }
  #room-badge {
    position: fixed;
    top: 16px; right: 16px;
    background: rgba(15, 23, 42, 0.75);
    color: #4ade80;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    z-index: 20;
  }
  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    display: none;
    z-index: 20;
  }
  #mobile-hint {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    color: #94a3b8;
    font-size: 12px;
    background: rgba(15,23,42,0.6);
    padding: 8px 14px;
    border-radius: 8px;
    display: none;
    z-index: 20;
  }
  #win-banner {
    position: fixed;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 23, 42, 0.95);
    color: #4ade80;
    padding: 30px 50px;
    border-radius: 16px;
    font-size: 28px;
    font-weight: bold;
    display: none;
    z-index: 200;
    text-align: center;
    pointer-events: all;
  }
  #win-banner button {
    display: block;
    margin: 16px auto 0;
    padding: 10px 24px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="lobby">
  <div class="lobby-card">
    <h1>🌍 Jelajah 3D</h1>
    <p class="subtitle">Jelajahi dunia & kumpulkan item bareng teman</p>

    <input type="text" id="nameInput" placeholder="Nama kamu" maxlength="12">

    <button class="btn-primary" id="btnCreate">Buat Room Baru</button>

    <div class="divider"><span>atau</span></div>

    <input type="text" id="codeInput" placeholder="Masukkan kode room" maxlength="6" style="text-transform:uppercase;">
    <button class="btn-secondary" id="btnJoin">Gabung Room</button>

    <div id="room-code-display"></div>
    <div id="lobby-status"></div>
  </div>
</div>

<div id="hud">
  <div class="score-row">
    <span>💎 <span class="you" id="scoreYou">0</span></span>
    <span>💎 <span class="friend" id="scoreFriend">0</span></span>
  </div>
  <div style="font-size:12px;color:#94a3b8;" id="itemsLeft">Item tersisa: -</div>
</div>
<div id="room-badge">Room: <span id="roomBadgeCode"></span></div>
<div id="crosshair"></div>
<div id="mobile-hint">WASD gerak • Mouse lihat sekitar • Klik untuk kunci kursor</div>

<div id="win-banner">
  <div id="win-text"></div>
  <button onclick="location.reload()">Main Lagi</button>
</div>

<canvas id="gameCanvas"></canvas>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =========================================================
   1) KONFIGURASI FIREBASE - GANTI DENGAN CONFIG KAMU SENDIRI
   Ambil dari: Firebase Console > Project Settings > General > Your apps
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDmrrWevnZW3sVBFXf8qruyOv2VXyNUvWw",
  authDomain: "game-3d-explore.firebaseapp.com",
  databaseURL: "https://game-3d-explore-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-3d-explore",
  storageBucket: "game-3d-explore.firebasestorage.app",
  messagingSenderId: "550733113996",
  appId: "1:550733113996:web:897217a87d38a8343fe9a9"
};
/* ========================================================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- Game State ----------
let scene, camera, renderer, clock;
let playerId = null;
let playerName = "";
let roomCode = null;
let isHost = false;
let myScore = 0;
let friendScore = 0;
let itemMeshes = {}; // itemId -> mesh
let itemsData = {};  // itemId -> {x,y,z,taken}
let otherPlayerMesh = null;
let otherPlayerId = null;
let totalItems = 12;

const keys = { w:false, a:false, s:false, d:false };
let yaw = 0, pitch = 0;
let pointerLocked = false;

const MOVE_SPEED = 6;
const WORLD_SIZE = 40;

// ---------- UI Elements ----------
const lobby = document.getElementById('lobby');
const hud = document.getElementById('hud');
const roomBadge = document.getElementById('room-badge');
const crosshair = document.getElementById('crosshair');
const mobileHint = document.getElementById('mobile-hint');
const lobbyStatus = document.getElementById('lobby-status');
const roomCodeDisplay = document.getElementById('room-code-display');
const winBanner = document.getElementById('win-banner');

document.getElementById('btnCreate').addEventListener('click', createRoom);
document.getElementById('btnJoin').addEventListener('click', joinRoom);

function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function genPlayerId() {
  return 'p_' + Math.random().toString(36).substr(2, 9);
}

async function createRoom() {
  playerName = document.getElementById('nameInput').value.trim() || 'Player1';
  roomCode = genRoomCode();
  playerId = genPlayerId();
  isHost = true;

  lobbyStatus.textContent = 'Membuat room...';

  // Generate items
  const items = {};
  for (let i = 0; i < totalItems; i++) {
    items['item_' + i] = {
      x: (Math.random() - 0.5) * WORLD_SIZE,
      y: 0.5,
      z: (Math.random() - 0.5) * WORLD_SIZE,
      taken: false
    };
  }

  try {
    await db.ref('rooms/' + roomCode).set({
      createdAt: Date.now(),
      items: items,
      players: {
        [playerId]: {
          name: playerName,
          x: 0, y: 1, z: 0, ry: 0,
          score: 0,
          color: '#38bdf8'
        }
      }
    });

    roomCodeDisplay.style.display = 'block';
    roomCodeDisplay.textContent = 'KODE: ' + roomCode;
    lobbyStatus.textContent = 'Menunggu teman gabung... Bagikan kode ini!';

    listenForSecondPlayer();
  } catch (e) {
    lobbyStatus.textContent = 'Gagal membuat room. Cek konfigurasi Firebase.';
    console.error(e);
  }
}

async function joinRoom() {
  playerName = document.getElementById('nameInput').value.trim() || 'Player2';
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!code) {
    lobbyStatus.textContent = 'Masukkan kode room dulu.';
    return;
  }
  roomCode = code;
  playerId = genPlayerId();
  isHost = false;

  lobbyStatus.textContent = 'Mencari room...';

  try {
    const snap = await db.ref('rooms/' + roomCode).get();
    if (!snap.exists()) {
      lobbyStatus.textContent = 'Room tidak ditemukan.';
      return;
    }
    const roomData = snap.val();
    const existingPlayers = Object.keys(roomData.players || {});
    if (existingPlayers.length >= 2) {
      lobbyStatus.textContent = 'Room sudah penuh (2 pemain).';
      return;
    }

    await db.ref(`rooms/${roomCode}/players/${playerId}`).set({
      name: playerName,
      x: 3, y: 1, z: 3, ry: 0,
      score: 0,
      color: '#fb7185'
    });

    itemsData = roomData.items || {};
    startGame();
  } catch (e) {
    lobbyStatus.textContent = 'Gagal bergabung. Cek konfigurasi Firebase.';
    console.error(e);
  }
}

function listenForSecondPlayer() {
  db.ref(`rooms/${roomCode}/players`).on('value', (snap) => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    if (ids.length >= 2 && !window.__gameStarted) {
      db.ref(`rooms/${roomCode}/items`).get().then(itemSnap => {
        itemsData = itemSnap.val() || {};
        startGame();
      });
    }
  });
}

function startGame() {
  window.__gameStarted = true;
  lobby.style.display = 'none';
  hud.style.display = 'block';
  roomBadge.style.display = 'block';
  crosshair.style.display = 'block';
  mobileHint.style.display = 'block';
  document.getElementById('roomBadgeCode').textContent = roomCode;

  initThree();
  spawnItems();
  listenToOtherPlayer();
  listenToItems();
  animate();
}

// ---------- THREE.JS SETUP ----------
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 20, 60);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);

  const canvas = document.getElementById('gameCanvas');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(20, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -30;
  scene.add(sun);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 1.5, WORLD_SIZE * 1.5);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a7c3c });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Decorative trees / obstacles
  for (let i = 0; i < 15; i++) {
    addTree(
      (Math.random() - 0.5) * WORLD_SIZE * 1.3,
      (Math.random() - 0.5) * WORLD_SIZE * 1.3
    );
  }

  // Boundary walls (invisible-ish)
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, transparent: true, opacity: 0.3 });
  const wallGeo = new THREE.BoxGeometry(WORLD_SIZE, 6, 1);
  const positions = [
    [0, 3, WORLD_SIZE/2], [0, 3, -WORLD_SIZE/2],
  ];
  positions.forEach(p => {
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(...p);
    scene.add(wall);
  });
  const wallGeo2 = new THREE.BoxGeometry(1, 6, WORLD_SIZE);
  [[WORLD_SIZE/2,3,0],[-WORLD_SIZE/2,3,0]].forEach(p => {
    const wall = new THREE.Mesh(wallGeo2, wallMat);
    wall.position.set(...p);
    scene.add(wall);
  });

  // Other player mesh
  const otherColor = isHost ? 0xfb7185 : 0x38bdf8;
  const geo = new THREE.CapsuleGeometry(0.4, 1, 4, 8);
  const mat = new THREE.MeshStandardMaterial({ color: otherColor });
  otherPlayerMesh = new THREE.Mesh(geo, mat);
  otherPlayerMesh.castShadow = true;
  otherPlayerMesh.visible = false;
  scene.add(otherPlayerMesh);

  clock = new THREE.Clock();

  window.addEventListener('resize', onResize);
  setupControls();
}

function addTree(x, z) {
  const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4226 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, 0.75, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leavesGeo = new THREE.ConeGeometry(1, 2, 8);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.set(x, 2.2, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

function spawnItems() {
  Object.keys(itemsData).forEach(itemId => {
    const item = itemsData[itemId];
    if (item.taken) return;
    const geo = new THREE.OctahedronGeometry(0.35);
    const mat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xfbbf24, emissiveIntensity: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(item.x, item.y, item.z);
    mesh.castShadow = true;
    scene.add(mesh);
    itemMeshes[itemId] = mesh;
  });
  updateItemsLeftUI();
}

function updateItemsLeftUI() {
  const left = Object.keys(itemMeshes).length;
  document.getElementById('itemsLeft').textContent = 'Item tersisa: ' + left;
}

// ---------- Controls ----------
function setupControls() {
  const canvas = document.getElementById('gameCanvas');
  canvas.addEventListener('click', () => {
    canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === canvas;
  });
  document.addEventListener('mousemove', (e) => {
    if (!pointerLocked) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
  });

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = true;
    if (k === 'a') keys.a = true;
    if (k === 's') keys.s = true;
    if (k === 'd') keys.d = true;
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = false;
    if (k === 'a') keys.a = false;
    if (k === 's') keys.s = false;
    if (k === 'd') keys.d = false;
  });
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ---------- Firebase Sync ----------
function listenToOtherPlayer() {
  db.ref(`rooms/${roomCode}/players`).on('value', (snap) => {
    const players = snap.val() || {};
    for (const id in players) {
      if (id !== playerId) {
        otherPlayerId = id;
        const p = players[id];
        otherPlayerMesh.position.set(p.x, p.y - 0.6, p.z);
        otherPlayerMesh.rotation.y = p.ry;
        otherPlayerMesh.visible = true;
        friendScore = p.score || 0;
        document.getElementById('scoreFriend').textContent = friendScore;
      } else {
        myScore = players[id].score || 0;
        document.getElementById('scoreYou').textContent = myScore;
      }
    }
    checkWin();
  });

  // Remove other player if they leave
  db.ref(`rooms/${roomCode}/players`).on('child_removed', (snap) => {
    if (snap.key === otherPlayerId) {
      otherPlayerMesh.visible = false;
    }
  });
}

function listenToItems() {
  db.ref(`rooms/${roomCode}/items`).on('child_changed', (snap) => {
    const itemId = snap.key;
    const data = snap.val();
    if (data.taken && itemMeshes[itemId]) {
      scene.remove(itemMeshes[itemId]);
      delete itemMeshes[itemId];
      updateItemsLeftUI();
    }
  });
}

let lastSync = 0;
function syncMyPosition() {
  const now = Date.now();
  if (now - lastSync < 80) return; // throttle updates
  lastSync = now;
  db.ref(`rooms/${roomCode}/players/${playerId}`).update({
    x: camera.position.x,
    y: camera.position.y,
    z: camera.position.z,
    ry: yaw
  });
}

function tryCollectItems() {
  const playerPos = camera.position;
  for (const itemId in itemMeshes) {
    const mesh = itemMeshes[itemId];
    const dist = playerPos.distanceTo(mesh.position);
    if (dist < 1.2) {
      collectItem(itemId);
    }
  }
}

function collectItem(itemId) {
  if (!itemMeshes[itemId]) return;
  scene.remove(itemMeshes[itemId]);
  delete itemMeshes[itemId];
  updateItemsLeftUI();

  db.ref(`rooms/${roomCode}/items/${itemId}`).update({ taken: true });
  myScore++;
  document.getElementById('scoreYou').textContent = myScore;
  db.ref(`rooms/${roomCode}/players/${playerId}`).update({ score: myScore });

  checkWin();
}

function checkWin() {
  const remaining = Object.keys(itemMeshes).length;
  if (remaining === 0 && !window.__gameEnded) {
    window.__gameEnded = true;
    let resultText;
    if (myScore > friendScore) resultText = '🎉 Kamu Menang! ' + myScore + ' vs ' + friendScore;
    else if (myScore < friendScore) resultText = '😅 Kamu Kalah. ' + myScore + ' vs ' + friendScore;
    else resultText = '🤝 Seri! ' + myScore + ' - ' + friendScore;

    document.getElementById('win-text').textContent = resultText;
    winBanner.style.display = 'block';
    document.exitPointerLock();
  }
}

// ---------- Game Loop ----------
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  // Movement
  const dir = new THREE.Vector3();
  if (keys.w) dir.z -= 1;
  if (keys.s) dir.z += 1;
  if (keys.a) dir.x -= 1;
  if (keys.d) dir.x += 1;

  if (dir.lengthSq() > 0) {
    dir.normalize();
    dir.applyEuler(new THREE.Euler(0, yaw, 0));
    camera.position.x += dir.x * MOVE_SPEED * delta;
    camera.position.z += dir.z * MOVE_SPEED * delta;

    // Clamp to world bounds
    const half = WORLD_SIZE / 2 - 1;
    camera.position.x = Math.max(-half, Math.min(half, camera.position.x));
    camera.position.z = Math.max(-half, Math.min(half, camera.position.z));

    syncMyPosition();
    tryCollectItems();
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Bobbing item animation
  for (const id in itemMeshes) {
    itemMeshes[id].rotation.y += delta * 2;
    itemMeshes[id].position.y = 0.5 + Math.sin(Date.now() * 0.003 + id.length) * 0.15;
  }

  renderer.render(scene, camera);
}

// Cleanup on unload
window.addEventListener('beforeunload', () => {
  if (roomCode && playerId) {
    db.ref(`rooms/${roomCode}/players/${playerId}`).remove();
  }
});
</script>
</body>
</html>
